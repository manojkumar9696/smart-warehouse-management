name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "npm ci"
      - run: "npm run build --if-present"

  deploy_2:
    needs: build_1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "echo \"Deploy App Service (configure credentials/secrets before use)\""
