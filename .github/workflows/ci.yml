name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test_1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "npm test"

  qa_2:
    needs: test_1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "npm run qa --if-present"

  deploy_3:
    needs: qa_2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "echo \"Deploy App Service (configure credentials/secrets before use)\""

  approval_4:
    needs: deploy_3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "echo \"Manual approval gate\""
